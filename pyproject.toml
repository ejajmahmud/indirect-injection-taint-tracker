[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indirect-injection-taint-tracker"
version = "0.1.0"
description = "Dynamic taint propagation and lineage tracker that flags untrusted web and user data flowing into privileged agent tool parameters"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
indirect-injection-taint-tracker = "indirect_injection_taint_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["indirect_injection_taint_tracker*"]
